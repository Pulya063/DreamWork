<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to DreamWork — access your personalized career roadmap and skill simulations.">
  <title>Sign In — DreamWork</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="auth-page">
    <div class="auth-card animate-fade-in-up">
      <div class="logo">Dream<span>Work</span></div>
      <p class="auth-subtitle">Welcome back. Sign in to continue your journey.</p>

      <form id="loginForm" onsubmit="return false;">
        <div class="flex flex-col gap-lg">

          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input class="form-input" type="email" id="email" placeholder="you@example.com" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input class="form-input" type="password" id="password" placeholder="••••••••" required>
          </div>

          <div class="flex justify-between items-center" style="margin-top:-0.25rem;">
            <label class="flex items-center gap-sm text-sm text-muted" style="cursor:pointer;">
              <input type="checkbox" style="accent-color:var(--color-gold);"> Remember me
            </label>
            <a href="#" class="text-sm">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-primary w-full" id="loginBtn" onclick="handleLogin()">Sign In</button>

        </div>
      </form>

      <div class="auth-divider"><span>or</span></div>

      <button class="btn btn-secondary w-full" style="margin-bottom:0.5rem;">
        <svg width="18" height="18" viewBox="0 0 24 24" style="margin-right:8px;"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Continue with Google
      </button>

      <p class="auth-footer">
        Don't have an account? <a href="register.html">Create one</a>
      </p>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
