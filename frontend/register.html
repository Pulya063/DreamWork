<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your DreamWork account — start your personalized career journey today.">
  <title>Create Account — DreamWork</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="auth-page">
    <div class="auth-card animate-fade-in-up" style="max-width:480px;">
      <div class="logo">Dream<span>Work</span></div>
      <p class="auth-subtitle">Create your account and take the first step.</p>

      <form id="registerForm" onsubmit="return false;">
        <div class="flex flex-col gap-lg">

          <div class="grid grid-2 gap-md">
            <div class="form-group">
              <label class="form-label" for="firstName">First Name</label>
              <input class="form-input" type="text" id="firstName" placeholder="Alexander" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="lastName">Last Name</label>
              <input class="form-input" type="text" id="lastName" placeholder="Sterling" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="regEmail">Email Address</label>
            <input class="form-input" type="email" id="regEmail" placeholder="you@example.com" required>
          </div>

          <div class="grid grid-2 gap-md">
            <div class="form-group">
              <label class="form-label" for="age">Age</label>
              <input class="form-input" type="number" id="age" placeholder="25" min="16" max="99" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="gender">Gender</label>
              <select class="form-input" id="gender">
                <option value="">Select…</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Prefer not to say</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="regPassword">Password</label>
            <input class="form-input" type="password" id="regPassword" placeholder="Min. 8 characters" required minlength="8">
          </div>

          <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm Password</label>
            <input class="form-input" type="password" id="confirmPassword" placeholder="Repeat your password" required>
          </div>

          <label class="flex items-center gap-sm text-sm text-muted" style="cursor:pointer;margin-top:-0.25rem;">
            <input type="checkbox" required style="accent-color:var(--color-gold);"> I agree to the <a href="#" style="margin-left:4px;">Terms & Privacy Policy</a>
          </label>

          <button type="submit" class="btn btn-primary w-full" id="registerBtn" onclick="handleRegister()">Create Account</button>

        </div>
      </form>

      <p class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </p>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
